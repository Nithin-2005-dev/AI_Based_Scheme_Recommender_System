version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: govscheme_db
    restart: always
    environment:
      POSTGRES_USER: govscheme
      POSTGRES_PASSWORD: govscheme123
      POSTGRES_DB: govscheme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govscheme -d govscheme"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
